<script>

const posterData = JSON.parse(document.getElementById('poster-data').textContent);
const europeGeo = JSON.parse(document.getElementById('geo-data').textContent);
const FLAGS_B64 = JSON.parse(document.getElementById('flags-data').textContent);

const W = 841, H = 1189;
const HEADER_H = 62;
const FOOTER_H = 526;
const MAP_Y0 = HEADER_H;
const MAP_H = H - HEADER_H - FOOTER_H;

const INK = "#f0e8d0";
const INK_SOFT = "rgba(200,185,155,0.62)";
const PAPER = "#04050f";
const LAND = "#10142c";
const LAND_STROKE = "rgba(255,255,255,0.10)";
const ERA1_ACCENT = "#D4A574";
const ERA2_ACCENT = "#5B8DB8";

const blocColorsFull = posterData.bloc_colors;
const blocColorsE1 = posterData.era1_bloc_colors;
const blocColorsE2 = posterData.era2_bloc_colors;

const CAT = {
  alliance:   {label:"loyal alliance",    musical:"Fortissimo",  color:"#F5A623", dash:null,     bend: 0.20},
  steady:     {label:"steady tie",        musical:"Moderato",    color:"#8C564B", dash:null,     bend: 0.13},
  strengthen: {label:"strengthened",      musical:"Crescendo",   color:"#27AE60", dash:null,     bend: 0.09},
  weaken:     {label:"weakened",          musical:"Diminuendo",  color:"#E74C3C", dash:null,     bend:-0.13},
  one_sided:  {label:"one-sided",         musical:"Dissonante",  color:"#E377C2", dash:null,     bend:-0.24},
  cold:       {label:"cold shoulder",     musical:"Silenzio",    color:"#999999", dash:"1,3",    bend: 0.05},
  new:        {label:"new since 2000",    musical:"Prima Volta", color:"#4A90D9", dash:null,     bend: 0.24}
};
const strengthW = d3.scaleLinear().domain([2.5,11]).range([0.5,2.6]).clamp(true);

const STEADY_EDGES = [
  {a:"Norway", b:"Sweden", type:"steady", strength:7.5, story:"Norway gives 8.4/12 on average, Sweden returns 6.6/12 \u2014 mutual affinity 7.5/12 over 48 co-eligible years."},
  {a:"Denmark", b:"Sweden", type:"steady", strength:7.65, story:"Mutual affinity 7.65/12 over 43 co-eligible years."},
  {a:"Estonia", b:"Finland", type:"steady", strength:7.6, story:"Mutual affinity 7.6/12 over 26 co-eligible years."},
  {a:"Estonia", b:"Latvia", type:"steady", strength:7.7, story:"Mutual affinity 7.7/12 over 25 co-eligible years."},
  {a:"Albania", b:"Greece", type:"steady", strength:7.9, story:"Mutual affinity 7.9/12 over 21 co-eligible years."},
  {a:"Germany", b:"Turkey", type:"steady", strength:8.0, story:"Mutual affinity 8.0/12 over 33 co-eligible years."},
  {a:"Bosnia and Herzegovina", b:"Turkey", type:"steady", strength:8.3, story:"Mutual affinity 8.3/12 over 17 co-eligible years."},
  {a:"Russia", b:"Ukraine", type:"steady", strength:7.2, story:"Mutual affinity 7.2/12 over 15 co-eligible years, entirely pre-dating Russia's 2022 suspension."}
];
posterData.edges = posterData.edges.concat(STEADY_EDGES);

const svg = d3.select("#root").append("svg")
  .attr("width", "100%").attr("height", "100%")
  .attr("viewBox", `0 0 ${W} ${H}`)
  .attr("preserveAspectRatio", "xMidYMid meet")
  .attr("xmlns", "http://www.w3.org/2000/svg");

svg.append("rect").attr("x",0).attr("y",0).attr("width",W).attr("height",H).attr("fill", PAPER);
const bgDefs = svg.append("defs");
const glow1 = bgDefs.append("radialGradient").attr("id","bgGlow1").attr("cx","50%").attr("cy","6%").attr("r","55%");
glow1.append("stop").attr("offset","0%").attr("stop-color","#0e1240").attr("stop-opacity",0.9);
glow1.append("stop").attr("offset","100%").attr("stop-color","#0e1240").attr("stop-opacity",0);
svg.append("rect").attr("x",0).attr("y",0).attr("width",W).attr("height",H).attr("fill","url(#bgGlow1)");
const glow2 = bgDefs.append("radialGradient").attr("id","bgGlow2").attr("cx","88%").attr("cy","96%").attr("r","45%");
glow2.append("stop").attr("offset","0%").attr("stop-color","#1a0a30").attr("stop-opacity",0.85);
glow2.append("stop").attr("offset","100%").attr("stop-color","#1a0a30").attr("stop-opacity",0);
svg.append("rect").attr("x",0).attr("y",0).attr("width",W).attr("height",H).attr("fill","url(#bgGlow2)");
const defs = svg.select("defs");

// ============================= HELPER FUNCTIONS =============================
function starMark(sel, cx, cy, r, color) {
  const pts = [];
  for (let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0 ? r : r*0.42;
    pts.push([cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)]);
  }
  sel.append("polygon").attr("points", pts.map(p=>p.join(",")).join(" "))
    .attr("fill", color).attr("stroke", INK).attr("stroke-width",0.3);
}

function drawFlagRect(sel, cx, cy, w, h, code) {
  const href = FLAGS_B64[code];
  const clipId = "flagclip-" + code + "-" + Math.round(cx) + "-" + Math.round(cy);
  defs.append("clipPath").attr("id", clipId)
    .append("rect").attr("x", cx-w/2).attr("y", cy-h/2).attr("width", w).attr("height", h).attr("rx", 1);
  if (href) {
    sel.append("image").attr("href", href)
      .attr("x", cx-w/2).attr("y", cy-h/2).attr("width", w).attr("height", h)
      .attr("preserveAspectRatio", "xMidYMid slice").attr("clip-path", `url(#${clipId})`);
  } else {
    sel.append("rect").attr("x",cx-w/2).attr("y",cy-h/2).attr("width",w).attr("height",h).attr("fill","#ddd");
  }
  sel.append("rect").attr("x",cx-w/2).attr("y",cy-h/2).attr("width",w).attr("height",h)
    .attr("fill","none").attr("stroke",INK).attr("stroke-width",0.35);
}

function heartPath(cx, cy, s) {
  return `M${cx},${cy+0.35*s}
    C${cx-0.10*s},${cy+0.22*s} ${cx-0.50*s},${cy-0.05*s} ${cx-0.50*s},${cy-0.32*s}
    C${cx-0.50*s},${cy-0.55*s} ${cx-0.22*s},${cy-0.60*s} ${cx},${cy-0.40*s}
    C${cx+0.22*s},${cy-0.60*s} ${cx+0.50*s},${cy-0.55*s} ${cx+0.50*s},${cy-0.32*s}
    C${cx+0.50*s},${cy-0.05*s} ${cx+0.10*s},${cy+0.22*s} ${cx},${cy+0.35*s} Z`;
}

function drawHeartIcon(sel, cx, cy, s, color) {
  sel.append("path").attr("d", heartPath(cx, cy, s)).attr("fill", color).attr("stroke", INK).attr("stroke-width",0.3);
}

function drawTrophy(sel, cx, cy, s, color) {
  // cup bowl
  sel.append("path").attr("d", `M${cx-0.28*s},${cy-0.4*s} Q${cx-0.28*s},${cy+0.05*s} ${cx},${cy+0.1*s} Q${cx+0.28*s},${cy+0.05*s} ${cx+0.28*s},${cy-0.4*s} Z`)
    .attr("fill", color).attr("stroke", INK).attr("stroke-width",0.35);
  // handles
  sel.append("path").attr("d", `M${cx-0.28*s},${cy-0.32*s} Q${cx-0.46*s},${cy-0.32*s} ${cx-0.46*s},${cy-0.18*s} Q${cx-0.46*s},${cy-0.04*s} ${cx-0.30*s},${cy-0.06*s}`)
    .attr("fill","none").attr("stroke", color).attr("stroke-width", s*0.05);
  sel.append("path").attr("d", `M${cx+0.28*s},${cy-0.32*s} Q${cx+0.46*s},${cy-0.32*s} ${cx+0.46*s},${cy-0.18*s} Q${cx+0.46*s},${cy-0.04*s} ${cx+0.30*s},${cy-0.06*s}`)
    .attr("fill","none").attr("stroke", color).attr("stroke-width", s*0.05);
  // stem + base
  sel.append("rect").attr("x",cx-0.06*s).attr("y",cy+0.08*s).attr("width",0.12*s).attr("height",0.22*s).attr("fill",color);
  sel.append("path").attr("d", `M${cx-0.22*s},${cy+0.30*s} L${cx+0.22*s},${cy+0.30*s} L${cx+0.16*s},${cy+0.42*s} L${cx-0.16*s},${cy+0.42*s} Z`)
    .attr("fill", color).attr("stroke", INK).attr("stroke-width",0.3);
  // small star on the cup
  starMark(sel, cx, cy-0.16*s, s*0.08, INK);
}

function drawMic(sel, cx, cy, s, color) {
  sel.append("rect").attr("x",cx-s*0.16).attr("y",cy-s*0.5).attr("width",s*0.32).attr("height",s*0.48).attr("rx",s*0.16)
    .attr("fill",color).attr("stroke",INK).attr("stroke-width",0.35);
  [0.1,0.22,0.34].forEach(f=>{
    sel.append("line").attr("x1",cx-s*0.1).attr("x2",cx+s*0.1).attr("y1",cy-s*0.5+s*f).attr("y2",cy-s*0.5+s*f)
      .attr("stroke",INK).attr("stroke-width",s*0.02).attr("opacity",0.5);

  sel.append("path").attr("d",`M${cx-s*0.26},${cy-s*0.06} A${s*0.26},${s*0.26} 0 0 0 ${cx+s*0.26},${cy-s*0.06}`)

const rScale = d3.scaleSqrt().domain([15,50]).range([2.6, 9.0]);

function arcPath(a, b, bend, endRadius) {
  const na = nodeById[a], nb = nodeById[b];
  if (!na || !nb) return null;
  const mx = (na._x+nb._x)/2, my = (na._y+nb._y)/2;
  const dx = nb._x-na._x, dy = nb._y-na._y;
  const dist = Math.sqrt(dx*dx+dy*dy) || 1;
  const nx = -dy/dist, ny = dx/dist;
  const cx = mx + nx*dist*bend, cy = my + ny*dist*bend;
  let endX = nb._x, endY = nb._y;
  if (endRadius) {
    // pull the endpoint back along the curve's tangent direction at t=1 (proportional to P1-C),
    // so the path - and the arrowhead placed at its tip - stops exactly at the node's boundary
    const tx = nb._x - cx, ty = nb._y - cy;
    const tdist = Math.sqrt(tx*tx+ty*ty) || 1;
    endX = nb._x - (tx/tdist)*endRadius;
    endY = nb._y - (ty/tdist)*endRadius;
  }
  return `M${na._x},${na._y} Q${cx},${cy} ${endX},${endY}`;
}

function wrapText(text, maxChars) {
  const words = text.split(" ");
  let lines = [], cur = "";
  words.forEach(w=>{ if ((cur+" "+w).trim().length > maxChars) { lines.push(cur.trim()); cur=w; } else { cur = cur ? cur+" "+w : w; } });
  if (cur) lines.push(cur.trim());
  return lines;
}

function drawEraInset(x0, y0, w, h, eraKey, blocColorsEra, title, accent) {

  defs.append("clipPath").attr("id",clipId).append("rect").attr("x",x0+2).attr("y",y0+2).attr("width",w-4).attr("height",h-4).attr("rx",2);
  const mapClip = g.append("g").attr("clip-path", `url(#${clipId})`);
  const eraNodes = posterData.nodes.filter(n => n[eraKey] !== null);
  // fit to ALL 42 qualifying countries (not just this era's subset) so both insets share the
  // exact same scale/zoom - otherwise a country could look bigger in one map purely from a
  // different projection scale, making the two maps impossible to compare directly
  const insetQualifyingCodes = new Set(posterData.nodes.map(n => n.code));
  const allFc = {type:"FeatureCollection", features: europeGeo.features.filter(f => insetQualifyingCodes.has(f.properties.ISO2))};
  const proj = d3.geoMercator().fitExtent([[x0+8,y0+22],[x0+w-8,y0+h-8]], allFc);
  const gp = d3.geoPath().projection(proj);
  const allCodes = new Set(posterData.nodes.map(n=>n.code));
  mapClip.selectAll("path").data(europeGeo.features.filter(f=>allCodes.has(f.properties.ISO2))).join("path")

    .attr("fill-opacity", f=>{ const n = nodeByCode[f.properties.ISO2]; return (n && n[eraKey] !== null) ? 0.68 : 0.78; })
    .attr("stroke",LAND_STROKE).attr("stroke-width",0.3);
  eraNodes.forEach(n=>{
    const p = proj([n.cap_lon, n.cap_lat]);
    mapClip.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",2.4)
      .attr("fill", blocColorsEra[String(n[eraKey])]).attr("stroke",INK).attr("stroke-width",0.3).attr("opacity",0.95);
  });
  // border drawn AFTER the map content, on top, so it's always a clean unbroken frame
  
  g.append("rect").attr("x",x0).attr("y",y0).attr("width",w).attr("height",20).attr("fill","#070814").attr("opacity",0.92);

}

function computeSlotPositions(groups, order) {
  const pos = {};
  let cursor = 0;
  order.forEach(k => { groups[k].forEach((n,i) => { pos[n.code] = cursor + i; }); cursor += groups[k].length + 2; });
  return pos;
}
// barycenter crossing-reduction: iterate a few passes, alternating which side is re-sorted
for (let pass = 0; pass < 4; pass++) {
  const leftPos = computeSlotPositions(leftGroups, leftOrder);
  Object.entries(rightGroups).forEach(([k,arr])=>{
    arr.sort((a,b)=>{
      const aStayed = a.era1_bloc!==null && String(a.era1_bloc)===k, bStayed = b.era1_bloc!==null && String(b.era1_bloc)===k;
      if (aStayed !== bStayed) return aStayed ? -1 : 1;
      const pa = a.era1_bloc===null ? 9999 : leftPos[a.code], pb = b.era1_bloc===null ? 9999 : leftPos[b.code];
      return pa!==pb ? pa-pb : a.code.localeCompare(b.code);
    });
  });
  const rightPos = computeSlotPositions(rightGroups, rightOrder);
  Object.entries(leftGroups).forEach(([k,arr])=>{
    arr.sort((a,b)=>{
      const aStayed = a.era2_bloc!==null && String(a.era2_bloc)===k, bStayed = b.era2_bloc!==null && String(b.era2_bloc)===k;
      if (aStayed !== bStayed) return aStayed ? -1 : 1;
      const pa = a.era2_bloc===null ? 9999 : rightPos[a.code], pb = b.era2_bloc===null ? 9999 : rightPos[b.code];
      return pa!==pb ? pa-pb : a.code.localeCompare(b.code);
    });
  });
}

{
